#:schema https://mise.jdx.dev/schema/mise.json

[tools]
1password = "latest"
cosign = "3.1.3"
go = "1.26.5"
golangci-lint = "2.12.2"
goreleaser = "2.17.1"
hugo-extended = "0.164.0"
node = "24"
pipx = "1.16.6"
pre-commit = "4.6.1"
task = "3.52.0"

"github:cloudsmith-io/cloudsmith-cli" = "1.21.0"

[env]
CURSECLI_LOG_LEVEL = "debug"
CURSECLI_LOG_PRETTY = "true"
CURSECLI_LOG_COLOR = "true"

CURSECLI_SERVER_TEMPLATES = "pkg/templates/dist/"
